name: Pull request metadata

# Title and label changes rerun only this small workflow, never repository validation.
on:
  pull_request:
    branches: [main, "release/v*"]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Pull request metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: 22.x
      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitprompt validate --input -
      - name: Require a changeset
        if: >-
          !cancelled() &&
          !contains(github.event.pull_request.labels.*.name, 'skip-changelog') &&
          !startsWith(github.head_ref, 'changeset-release/') &&
          !startsWith(github.head_ref, 'release/v')
        run: |
          pnpm changeset status --since="$BASE_SHA" --output="$RUNNER_TEMP/changeset-status.json"
          jq -e '.releases | length > 0' "$RUNNER_TEMP/changeset-status.json" >/dev/null

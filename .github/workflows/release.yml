name: Release

on:
  push:
    branches: [main]
    paths:
      - ".changeset/**"
      - "packages/*/package.json"
      - "packages/*/CHANGELOG.md"
      - "extensions/dep-beacon/Cargo.toml"
      - "extensions/dep-beacon/Cargo.lock"
      - "extensions/dep-beacon/extension.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create release pull request or publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: write
      contents: write
      id-token: write
      pull-requests: write
    environment:
      name: release
      url: https://www.npmjs.com/package/@santi020k/dep-beacon-core
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Fetch publishing secrets
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /
          recursive: true
      - name: Prepare publishing authentication
        run: |
          test -n "$NPM_TOKEN"
          printf 'NODE_AUTH_TOKEN=%s\n' "$NPM_TOKEN" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate release artifacts
        run: pnpm run validate
      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm run release
          version: pnpm run version-packages
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HUSKY: 0
          NPM_CONFIG_PROVENANCE: "true"
      - name: Validate release pull request
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref changeset-release/main
      - name: Create umbrella version tag
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          VERSION="$(node -p "require('./packages/dep-beacon-core/package.json').version")"
          if ! jq -e \
            --arg version "$VERSION" \
            '.[] | select(.name == "@santi020k/dep-beacon-core" and .version == $version)' \
            <<<"$PUBLISHED_PACKAGES" >/dev/null; then
            echo "Core package ${VERSION} was not published; skipping umbrella tag."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists; skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
      - name: Publish VS Code extension
        if: steps.changesets.outputs.published == 'true'
        run: |
          test -n "$VSCE_PAT"
          test -n "$OVSX_PAT"
          pnpm --filter vscode-dep-beacon publish:ext

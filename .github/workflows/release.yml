name: Release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Source commit; normal releases require the selected ref SHA
        required: false
        type: string
      recover_published:
        description: Recover verified v1.3.0 delivery from its authorized source commit
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create release pull request or publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: write
      contents: write
      id-token: write
      pull-requests: write
    environment:
      name: release
      url: https://www.npmjs.com/package/@santi020k/dep-beacon-core
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha || github.sha }}
      - name: Verify source for normal release
        if: '!inputs.recover_published'
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.commit_sha || github.sha }}
          SELECTED_REF_SHA: ${{ github.sha }}
        run: |
          test "$EXPECTED_SOURCE_SHA" = "$SELECTED_REF_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ffa37774f75b2b8e761fe3d71e7046cdb6694a69 # v1
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
      - name: Verify publishing authentication
        run: test -n "$NODE_AUTH_TOKEN"
      - name: Verify published artifacts before recovery
        if: inputs.recover_published
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.commit_sha }}
          AUTHORIZED_RECOVERY_SOURCE_SHA: 2105e4efacd90e81b242bb058378382c9d03bdbc
        run: |
          test "$EXPECTED_SOURCE_SHA" = "$AUTHORIZED_RECOVERY_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_RECOVERY_SOURCE_SHA"
          pnpm run build
          python3 - <<'PYTHON'
          import base64
          import hashlib
          import io
          import json
          import subprocess
          import tarfile
          import tempfile
          from pathlib import Path
          from urllib.parse import urlparse
          from urllib.request import urlopen

          def fetch(url):
              with urlopen(url, timeout=30) as response:
                  return response.read()

          def contents(data):
              with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
                  files = {}
                  for entry in archive.getmembers():
                      if entry.isfile():
                          if entry.name in files:
                              raise ValueError('Duplicate package file')
                          files[entry.name] = archive.extractfile(entry).read()
                  return files

          for slug in ('dep-beacon-core', 'dep-beacon-lsp'):
              package_dir = Path('packages') / slug
              manifest = json.loads((package_dir / 'package.json').read_text())
              name, version = manifest['name'], manifest['version']
              metadata = json.loads(fetch(f'https://registry.npmjs.org/{name}/{version}'))
              if metadata['name'] != name or metadata['version'] != version:
                  raise ValueError('Published package identity differs')
              tarball = metadata['dist']['tarball']
              if urlparse(tarball).scheme != 'https' or urlparse(tarball).netloc != 'registry.npmjs.org':
                  raise ValueError('Unexpected package registry')
              published = fetch(tarball)
              integrity = 'sha512-' + base64.b64encode(hashlib.sha512(published).digest()).decode()
              if integrity != metadata['dist']['integrity']:
                  raise ValueError('Published artifact integrity differs')
              with tempfile.TemporaryDirectory() as directory:
                  packed = Path(directory) / 'package.tgz'
                  subprocess.run(['pnpm', 'pack', '--out', str(packed)], cwd=package_dir, check=True)
                  if contents(packed.read_bytes()) != contents(published):
                      raise ValueError(f'{name}@{version} does not match the release source')
              print(f'Verified exact published artifact: {name}@{version}')
          PYTHON
      - name: Reconcile verified release records
        if: inputs.recover_published
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ inputs.commit_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for directory in packages/dep-beacon-core packages/dep-beacon-lsp; do
            name="$(node -p "require('./$directory/package.json').name")"
            version="$(node -p "require('./$directory/package.json').version")"
            tag="${name}@${version}"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              git fetch origin "refs/tags/$tag:refs/tags/$tag"
            elif ! git rev-parse --verify "$tag^{commit}" >/dev/null 2>&1; then
              git tag -a "$tag" -m "$tag" "$EXPECTED_SOURCE_SHA"
            fi
            if [[ "$(git rev-parse "$tag^{commit}")" != "$EXPECTED_SOURCE_SHA" ]]; then
              echo "Existing release tag does not match the verified source: $tag"
              exit 1
            fi
            git push origin "refs/tags/$tag"
            if gh release view "$tag" --json isDraft > /tmp/existing-release.json 2>/dev/null; then
              if jq -e '.isDraft' /tmp/existing-release.json >/dev/null; then
                gh release edit "$tag" --draft=false
              fi
            else
              python3 - "$directory/CHANGELOG.md" "$version" <<'PYTHON'
          import sys
          from pathlib import Path

          changelog = Path(sys.argv[1]).read_text()
          heading = '## ' + sys.argv[2] + '\n'
          if heading not in changelog:
              raise ValueError('Release changelog entry is missing')
          notes = changelog.split(heading, 1)[1].split('\n## ', 1)[0].strip()
          Path('/tmp/release-notes.md').write_text(notes + '\n')
          PYTHON
              gh release create "$tag" --verify-tag --title "$tag" --notes-file /tmp/release-notes.md
            fi
          done
          packages="$(node --input-type=commonjs <<'JS'
          const packages = ['dep-beacon-core', 'dep-beacon-lsp'].map(slug => {
            const pkg = require('./packages/' + slug + '/package.json');
            return {name: pkg.name, version: pkg.version};
          });
          process.stdout.write(JSON.stringify(packages));
          JS
          )"
          echo "published-packages=$packages" >> "$GITHUB_OUTPUT"
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Create release pull request or publish
        if: '!inputs.recover_published'
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm run release
          version-script: pnpm run version-packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          create-github-releases: true
          push-with-git-cli: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HUSKY: 0
          NPM_CONFIG_PROVENANCE: "true"
      - name: Validate release pull request
        if: steps.changesets.outputs['pr-number'] != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref changeset-release/main
      - name: Create umbrella version tag
        if: steps.recovery.outputs.published == 'true' || steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: >-
            ${{ steps.recovery.outputs['published-packages'] ||
                steps.changesets.outputs['published-packages'] }}
        run: |
          VERSION="$(node -p "require('./packages/dep-beacon-core/package.json').version")"
          if ! jq -e \
            --arg version "$VERSION" \
            '.[] | select(.name == "@santi020k/dep-beacon-core" and .version == $version)' \
            <<<"$PUBLISHED_PACKAGES" >/dev/null; then
            echo "Core package ${VERSION} was not published; skipping umbrella tag."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/v${VERSION}:refs/tags/v${VERSION}"
            test "$(git rev-parse "v${VERSION}^{commit}")" = "$(git rev-parse HEAD)"
            echo "Tag v${VERSION} already matches the verified source; skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
      - name: Publish VS Code extension
        if: steps.recovery.outputs.published == 'true' || steps.changesets.outputs.published == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          test -n "$VSCE_PAT"
          test -n "$OVSX_PAT"
          pnpm --filter vscode-dep-beacon publish:ext
      - name: Publish Zed extension
        if: steps.recovery.outputs.published == 'true' || steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.commit_sha || github.sha }}
        run: gh workflow run zed-release.yml --ref main -f source_sha="$SOURCE_SHA"

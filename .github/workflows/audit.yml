name: Dependency audit

# Reports the live advisory audit without blocking ordinary pull requests. The CI
# workflow keeps the same audit as a blocking gate for releases, pushes, and manual runs.
on:
  pull_request:
    branches: [main, "release/v*"]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Dependency audit
    if: >-
      github.event_name != 'pull_request' ||
      !(startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'changeset-release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: 22.x
      - name: Audit dependencies
        run: pnpm run check:audit

name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "scripts/**"
      - "*.js"
      - "*.ts"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "scripts/**"
      - "*.js"
      - "*.ts"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "24 5 1 * *"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
      - name: Perform CodeQL analysis
        id: analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
      - name: Preserve comparison with the historical language category
        env:
          SARIF_DIRECTORY: ${{ steps.analysis.outputs.sarif-output }}
        run: |
          node --input-type=module <<'JS'
          import { mkdirSync, readFileSync, readdirSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const output = join(process.env.RUNNER_TEMP, 'codeql-language-category');
          mkdirSync(output, { recursive: true });
          for (const name of readdirSync(process.env.SARIF_DIRECTORY)) {
            if (!name.endsWith('.sarif')) continue;
            const sarif = JSON.parse(readFileSync(join(process.env.SARIF_DIRECTORY, name), 'utf8'));
            // Preserve all results; only match the second category already present on main.
            for (const run of sarif.runs) {
              run.automationDetails = { ...run.automationDetails, id: '/language:javascript-typescript/' };
            }
            writeFileSync(join(output, name), JSON.stringify(sarif));
          }
          JS
      - name: Upload analysis for the historical language category
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: ${{ runner.temp }}/codeql-language-category
          category: /language:javascript-typescript

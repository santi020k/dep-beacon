name: Publish Zed Extension

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Released commit to publish; defaults to the selected ref
        required: false
        type: string

concurrency:
  group: zed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-zed-extension:
    name: Open Zed extensions registry PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: zed
      url: https://beacon.santi020k.com/docs/zed-extension
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      ZED_EXTENSIONS_TOKEN: ${{ secrets.ZED_EXTENSIONS_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}
      - name: Read Zed extension version
        id: zed-version
        run: |
          version="$(node -p "require('./packages/dep-beacon-lsp/package.json').version")"
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' extensions/dep-beacon-lsp/extension.toml)"
          if [[ "$version" != "$manifest_version" ]]; then
            echo "package.json version ($version) does not match extension.toml version ($manifest_version)."
            exit 1
          fi
          previous_version="$(
            git show "${SOURCE_SHA}^:packages/dep-beacon-lsp/package.json" 2>/dev/null |
              node -p "JSON.parse(require('node:fs').readFileSync(0, 'utf8')).version" 2>/dev/null || true
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$version" != "$previous_version" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Language server version is unchanged; skipping Zed registry publication."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify matching language server is published
        id: npm-version
        if: steps.zed-version.outputs.changed == 'true'
        env:
          ZED_VERSION: ${{ steps.zed-version.outputs.version }}
        run: |
          published_version="$(npm view "@santi020k/dep-beacon-lsp@${ZED_VERSION}" version 2>/dev/null || true)"
          if [[ "$published_version" != "$ZED_VERSION" ]]; then
            echo "Matching language server ${ZED_VERSION} is not available on npm; skipping."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Install pnpm
        if: steps.npm-version.outputs.available == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        if: steps.npm-version.outputs.available == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: pnpm
      - name: Install dependencies
        if: steps.npm-version.outputs.available == 'true'
        run: pnpm install --frozen-lockfile
      - name: Validate Zed package
        if: steps.npm-version.outputs.available == 'true'
        run: |
          pnpm --filter @santi020k/dep-beacon-core build
          pnpm --filter @santi020k/dep-beacon-lsp build
          pnpm --filter @santi020k/dep-beacon-lsp typecheck
          pnpm --filter @santi020k/dep-beacon-lsp test
          pnpm --filter @santi020k/dep-beacon-lsp validate:extension
      - name: Validate Zed publishing configuration
        if: steps.npm-version.outputs.available == 'true'
        env:
          ZED_EXTENSIONS_FORK: ${{ vars.ZED_EXTENSIONS_FORK }}
        run: |
          test -n "$ZED_EXTENSIONS_TOKEN"
          test -n "$ZED_EXTENSIONS_FORK"
      - name: Check out Zed extensions fork
        if: steps.npm-version.outputs.available == 'true'
        env:
          ZED_EXTENSIONS_FORK: ${{ vars.ZED_EXTENSIONS_FORK }}
          ZED_VERSION: ${{ steps.zed-version.outputs.version }}
        run: |
          git clone "https://x-access-token:${ZED_EXTENSIONS_TOKEN}@github.com/${ZED_EXTENSIONS_FORK}.git" zed-extensions
          cd zed-extensions
          git remote add upstream https://github.com/zed-industries/extensions.git
          git fetch upstream main
          git checkout -B "dep-beacon-lsp-${ZED_VERSION}" upstream/main
      - name: Update registry entry
        id: registry-update
        if: steps.npm-version.outputs.available == 'true'
        working-directory: zed-extensions
        env:
          ZED_VERSION: ${{ steps.zed-version.outputs.version }}
        run: |
          git config user.name "Santiago Molina"
          git config user.email "17752391+santi020k@users.noreply.github.com"
          if [[ ! -d extensions/dep-beacon-lsp ]]; then
            git submodule add https://github.com/santi020k/dep-beacon extensions/dep-beacon-lsp
          fi
          git -C extensions/dep-beacon-lsp fetch origin "$SOURCE_SHA"
          git -C extensions/dep-beacon-lsp checkout "$SOURCE_SHA"
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path('extensions.toml')
          text = path.read_text()
          version = os.environ['ZED_VERSION']
          entry = (
              '[dep-beacon-lsp]\n'
              'submodule = "extensions/dep-beacon-lsp"\n'
              'path = "extensions/dep-beacon-lsp"\n'
              f'version = "{version}"\n'
          )
          marker = '[dep-beacon-lsp]'

          if marker in text:
              start = text.index(marker)
              next_start = text.find('\n[', start + 1)
              if next_start == -1:
                  text = text[:start].rstrip() + '\n\n' + entry
              else:
                  text = text[:start].rstrip() + '\n\n' + entry + '\n' + text[next_start + 1:].lstrip()
          else:
              text = entry + '\n' + text.lstrip()

          path.write_text(text)
          PY
          pnpm install --frozen-lockfile
          pnpm run sort-extensions
          git add .gitmodules extensions.toml extensions/dep-beacon-lsp
          if git diff --cached --quiet; then
            echo "Zed registry entry is already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "dep-beacon-lsp ${ZED_VERSION}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git push --force-with-lease origin "dep-beacon-lsp-${ZED_VERSION}"
      - name: Open Zed registry pull request
        if: steps.registry-update.outputs.changed == 'true'
        working-directory: zed-extensions
        env:
          ZED_EXTENSIONS_HEAD: ${{ vars.ZED_EXTENSIONS_HEAD || github.repository_owner }}
          ZED_VERSION: ${{ steps.zed-version.outputs.version }}
        run: |
          export GH_TOKEN="$ZED_EXTENSIONS_TOKEN"
          existing_pr="$(
            gh api --method GET repos/zed-industries/extensions/pulls \
              -f state=open \
              -f "head=${ZED_EXTENSIONS_HEAD}:dep-beacon-lsp-${ZED_VERSION}" \
              --jq '.[0].number // empty'
          )"
          if [[ -n "$existing_pr" ]]; then
            echo "Zed registry pull request #${existing_pr} already exists."
            gh pr comment "$existing_pr" --repo zed-industries/extensions --body '@cla-bot check'
            exit 0
          fi
          gh pr create \
            --repo zed-industries/extensions \
            --head "${ZED_EXTENSIONS_HEAD}:dep-beacon-lsp-${ZED_VERSION}" \
            --base main \
            --title "Add dep-beacon-lsp ${ZED_VERSION}" \
            --body "Publishes dep-beacon-lsp ${ZED_VERSION}.\n\nSource: https://github.com/santi020k/dep-beacon/tree/${SOURCE_SHA}/extensions/dep-beacon-lsp"

name: Prepare Zed Extension

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Released commit for the registry update; defaults to the selected ref
        required: false
        type: string

concurrency:
  group: zed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-zed-extension:
    name: Prepare Zed extensions registry branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: zed
      url: https://beacon.santi020k.com/docs/zed-extension
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}
      - name: Read Zed extension version
        id: zed-version
        run: |
          version="$(node -p "require('./packages/dep-beacon-lsp/package.json').version")"
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' extensions/dep-beacon-lsp/extension.toml)"
          if [[ "$version" != "$manifest_version" ]]; then
            echo "package.json version ($version) does not match extension.toml version ($manifest_version)."
            exit 1
          fi
          previous_version="$(
            git show "${SOURCE_SHA}^:packages/dep-beacon-lsp/package.json" 2>/dev/null |
              node -p "JSON.parse(require('node:fs').readFileSync(0, 'utf8')).version" 2>/dev/null || true
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$version" != "$previous_version" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Language server version is unchanged; skipping Zed registry publication."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify matching language server is published
        id: npm-version
        if: steps.zed-version.outputs.changed == 'true'
        env:
          ZED_VERSION: ${{ steps.zed-version.outputs.version }}
        run: |
          published_version="$(npm view "@santi020k/dep-beacon-lsp@${ZED_VERSION}" version 2>/dev/null || true)"
          if [[ "$published_version" != "$ZED_VERSION" ]]; then
            echo "Matching language server ${ZED_VERSION} is not available on npm; skipping."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Set up pnpm workspace
        if: steps.npm-version.outputs.available == 'true'
        uses: santi020k/quality/actions/setup-pnpm@ffa37774f75b2b8e761fe3d71e7046cdb6694a69 # v1
        with:
          node-version: 22.x
      - name: Validate Zed package
        if: steps.npm-version.outputs.available == 'true'
        run: |
          pnpm --filter @santi020k/dep-beacon-core build
          pnpm --filter @santi020k/dep-beacon-lsp build
          pnpm --filter @santi020k/dep-beacon-lsp typecheck
          pnpm --filter @santi020k/dep-beacon-lsp test
          pnpm --filter @santi020k/dep-beacon-lsp validate:extension
      - name: Validate Zed publishing configuration
        if: steps.npm-version.outputs.available == 'true'
        env:
          ZED_EXTENSIONS_FORK: ${{ vars.ZED_EXTENSIONS_FORK }}
          ZED_EXTENSIONS_TOKEN: ${{ secrets.ZED_EXTENSIONS_TOKEN }}
        run: |
          test -n "$ZED_EXTENSIONS_TOKEN"
          test -n "$ZED_EXTENSIONS_FORK"
      - name: Check out Zed extensions fork
        if: steps.npm-version.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          repository: ${{ vars.ZED_EXTENSIONS_FORK }}
          token: ${{ secrets.ZED_EXTENSIONS_TOKEN }}
          path: zed-extensions
          fetch-depth: 0
      - name: Fetch upstream registry
        if: steps.npm-version.outputs.available == 'true'
        working-directory: zed-extensions
        run: |
          git remote add upstream https://github.com/zed-industries/extensions.git
          git fetch upstream main
      - name: Select fork-known upstream ancestry
        if: steps.npm-version.outputs.available == 'true'
        working-directory: zed-extensions
        env:
          ZED_VERSION: ${{ steps.zed-version.outputs.version }}
        run: |
          base=""
          best_distance=""
          while IFS= read -r ref; do
            candidate="$(git merge-base upstream/main "$ref" || true)"
            if [[ -z "$candidate" ]] || ! git diff --quiet "$candidate" "$ref" -- .github/workflows; then
              continue
            fi
            distance="$(git rev-list --count "$candidate..upstream/main")"
            if [[ -z "$base" || "$distance" -lt "$best_distance" ]]; then
              base="$candidate"
              best_distance="$distance"
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/)
          if [[ -z "$base" ]]; then
            echo "No shared upstream ancestor has workflow files already present in the fork."
            echo "A maintainer must prepare a compatible fork ref; token scopes were not changed."
            exit 1
          fi
          echo "Using shared upstream ancestor $base without inheriting new workflow files."
          git switch --create "dep-beacon-lsp-${ZED_VERSION}" "$base"
      - name: Update registry entry
        id: registry-update
        if: steps.npm-version.outputs.available == 'true'
        working-directory: zed-extensions
        env:
          ZED_VERSION: ${{ steps.zed-version.outputs.version }}
        run: |
          git config user.name "Santiago Molina"
          git config user.email "17752391+santi020k@users.noreply.github.com"
          if [[ ! -d extensions/dep-beacon-lsp ]]; then
            git submodule add https://github.com/santi020k/dep-beacon extensions/dep-beacon-lsp
          fi
          git submodule update --init extensions/dep-beacon-lsp
          git -C extensions/dep-beacon-lsp fetch origin "$SOURCE_SHA"
          git -C extensions/dep-beacon-lsp checkout "$SOURCE_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path('extensions.toml')
          text = path.read_text()
          version = os.environ['ZED_VERSION']
          entry = (
              '[dep-beacon-lsp]\n'
              'submodule = "extensions/dep-beacon-lsp"\n'
              'path = "extensions/dep-beacon-lsp"\n'
              f'version = "{version}"\n'
          )
          marker = '[dep-beacon-lsp]'

          if marker in text:
              start = text.index(marker)
              next_start = text.find('\n[', start + 1)
              if next_start == -1:
                  text = text[:start].rstrip() + '\n\n' + entry
              else:
                  text = text[:start].rstrip() + '\n\n' + entry + '\n' + text[next_start + 1:].lstrip()
          else:
              text = entry + '\n' + text.lstrip()

          path.write_text(text)
          PY
          pnpm install --frozen-lockfile
          pnpm run sort-extensions
          git add .gitmodules extensions.toml extensions/dep-beacon-lsp
          branch="dep-beacon-lsp-${ZED_VERSION}"
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            if ! git diff --cached --quiet "refs/remotes/origin/$branch" --; then
              echo "Existing registry branch differs; preserve it for maintainer review."
              exit 1
            fi
            echo "Registry branch already contains the requested update."
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --cached --quiet; then
            echo "Zed registry entry is already up to date."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "dep-beacon-lsp ${ZED_VERSION}"
          git push origin "HEAD:refs/heads/$branch"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Hand off Zed registry submission
        if: steps.registry-update.outputs.ready == 'true'
        env:
          ZED_EXTENSIONS_FORK: ${{ vars.ZED_EXTENSIONS_FORK }}
          ZED_VERSION: ${{ steps.zed-version.outputs.version }}
        run: |
          fork="${ZED_EXTENSIONS_FORK/\//:}"
          compare="https://github.com/zed-industries/extensions/compare/main...${fork}:dep-beacon-lsp-${ZED_VERSION}"
          {
            echo "## Zed registry update ready for human submission"
            echo ""
            echo "[Review the registry update and open the PR](${compare}?expand=1)."
            echo "Write the PR description and maintainer replies in your own words."
            echo "The upstream AI policy requires a human in the loop; no PR or comment was created."
          } >> "$GITHUB_STEP_SUMMARY"

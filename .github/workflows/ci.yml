name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      verify_credentials:
        description: Verify existing delivery credentials with read-only provider calls
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected areas
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.paths.outputs.docs }}
      packages: ${{ steps.paths.outputs.packages }}
      release: ${{ steps.paths.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 2
      - id: paths
        name: Classify changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "packages=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" HEAD > /tmp/changed-files
          docs_pattern='^(apps/docs/|packages/|scripts/generate-assets\.mjs$|'
          docs_pattern+='pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/ci\.yml$)'
          if grep -Eq "$docs_pattern" /tmp/changed-files; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi
          packages_pattern='^(packages/|extensions/|scripts/|package\.json$|pnpm-lock\.yaml$|'
          packages_pattern+='pnpm-workspace\.yaml$|turbo\.json$|tsconfig\.|eslint\.config\.|\.github/workflows/)'
          if grep -Eq "$packages_pattern" /tmp/changed-files; then
            echo "packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "packages=false" >> "$GITHUB_OUTPUT"
          fi
          release_pattern='^(\.changeset/|packages/[^/]+/(package\.json|CHANGELOG\.md)$|'
          release_pattern+='extensions/dep-beacon-lsp/(Cargo\.toml|Cargo\.lock|extension\.toml)$|'
          release_pattern+='\.github/workflows/release\.yml$)'
          if grep -Eq "$release_pattern" /tmp/changed-files; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  validation:
    name: Full validation (22.x)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ffa37774f75b2b8e761fe3d71e7046cdb6694a69 # v1
        with:
          node-version: 22.x
      - name: Audit dependencies
        run: pnpm audit --audit-level moderate
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitprompt validate --input -
      - name: Require a changeset
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'skip-changelog') &&
          !startsWith(github.head_ref, 'changeset-release/') &&
          !startsWith(github.head_ref, 'release/v')
        run: |
          pnpm changeset status --since=origin/main --output=/tmp/changeset-status.json
          jq -e '.releases | length > 0' /tmp/changeset-status.json >/dev/null
      - name: Run repository validation
        run: pnpm run validate
      - name: Verify prepared release versions
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/v')
        env:
          RELEASE_BRANCH: ${{ github.head_ref }}
        run: pnpm run check:release
      - name: Install documentation browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Verify documentation interactions
        run: pnpm run test:docs
      - name: Check the Zed adapter
        run: cargo check --locked --manifest-path extensions/dep-beacon-lsp/Cargo.toml

  compatibility:
    name: Package compatibility (24.x)
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ffa37774f75b2b8e761fe3d71e7046cdb6694a69 # v1
        with:
          node-version: 24.x
      - name: Build, typecheck, and test published packages
        run: >-
          pnpm exec turbo run build typecheck test
          --filter=@santi020k/dep-beacon-core
          --filter=@santi020k/dep-beacon-lsp
          --filter=vscode-dep-beacon

  deploy-docs:
    name: Deploy documentation
    needs: [changes, validation, compatibility]
    if: >-
      always() &&
      !inputs.verify_credentials &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.docs == 'true' &&
      needs.validation.result == 'success' &&
      (needs.compatibility.result == 'success' || needs.compatibility.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: docs-production
      url: ${{ vars.DEP_BEACON_DOCS_URL || 'https://beacon.santi020k.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ffa37774f75b2b8e761fe3d71e7046cdb6694a69 # v1
        with:
          node-version: 22.x
      - name: Build and deploy documentation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT_NAME: >-
            ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME ||
                vars.CLOUDFLARE_PAGES_PROJECT_NAME ||
                'dep-beacon-docs' }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm run assets
          pnpm --filter @santi020k/dep-beacon-docs build
          pnpm exec wrangler pages deploy apps/docs/dist \
            --project-name="$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch="$GITHUB_REF_NAME" \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=true

  credentials:
    name: Read-only delivery credential verification
    if: github.event_name == 'workflow_dispatch' && inputs.verify_credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ffa37774f75b2b8e761fe3d71e7046cdb6694a69 # v1
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
      - name: Verify npm identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          npm whoami >/dev/null 2>&1 || { echo 'npm identity verification failed'; exit 1; }
          echo 'npm identity verified; publishing scope still requires confirmation'
      - name: Verify VS Code publisher access
        if: always()
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          test -n "$VSCE_PAT"
          pnpm --filter vscode-dep-beacon exec vsce verify-pat santi020k >/dev/null 2>&1 || {
            echo 'VS Code publisher access verification failed'; exit 1;
          }
          echo 'VS Code publisher access verified; Marketplace role still requires confirmation'
      - name: Verify Open VSX publishing access
        if: always()
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          test -n "$OVSX_PAT"
          pnpm --filter vscode-dep-beacon exec ovsx verify-pat santi020k >/dev/null 2>&1 || {
            echo 'Open VSX namespace publishing access verification failed'; exit 1;
          }
          echo 'Open VSX namespace publishing access verified'
      - name: Verify documentation project and Zed fork access
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: >-
            ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME || vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'dep-beacon-docs' }}
          ZED_EXTENSIONS_TOKEN: ${{ secrets.ZED_EXTENSIONS_TOKEN }}
          ZED_EXTENSIONS_FORK: ${{ vars.ZED_EXTENSIONS_FORK }}
        run: |
          node --input-type=module <<'JS'
          const required = name => {
            const value = process.env[name];
            if (!value) throw new Error(`Missing ${name}`);
            return value;
          };
          const get = async (url, token) => {
            const response = await fetch(url, {
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
              signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`Provider access failed: HTTP ${response.status}`);
            return response.json();
          };
          const checks = await Promise.allSettled([
            (async () => {
            const account = encodeURIComponent(required('CLOUDFLARE_ACCOUNT_ID'));
            const project = encodeURIComponent(required('CLOUDFLARE_PAGES_PROJECT_NAME'));
            const docs = await get(`https://api.cloudflare.com/client/v4/accounts/${account}/pages/projects/${project}`,
              required('CLOUDFLARE_API_TOKEN'));
            if (!docs.success || !docs.result?.name) throw new Error('Documentation project access failed');
            console.log('Cloudflare account and documentation project read access verified');
            console.log('Cloudflare write scope still requires confirmation');
            })(),
            (async () => {
            const fork = required('ZED_EXTENSIONS_FORK');
            if (!/^[\w.-]+\/[\w.-]+$/.test(fork)) throw new Error('Invalid Zed fork configuration');
            const zed = await get(`https://api.github.com/repos/${fork}`, required('ZED_EXTENSIONS_TOKEN'));
            if (!zed.permissions?.push) throw new Error('Zed fork write permission is unavailable');
            console.log('Zed token and fork push permission verified without writing');
            console.log('Upstream PR access still requires confirmation');
            })(),
          ]);
          const labels = ['Cloudflare documentation project', 'Zed fork'];
          for (const [index, check] of checks.entries()) {
            if (check.status !== 'rejected') continue;
            console.error(`${labels[index]} credential verification failed; inspect provider access privately`);
            process.exitCode = 1;
          }
          JS

  gate:
    name: Required checks
    if: always()
    needs: [changes, validation, compatibility, deploy-docs, credentials]
    runs-on: ubuntu-latest
    steps:
      - name: Verify relevant jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          VALIDATION: ${{ needs.validation.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
          DEPLOY: ${{ needs.deploy-docs.result }}
          CREDENTIALS: ${{ needs.credentials.result }}
        run: |
          for result in "$CHANGES" "$VALIDATION" "$COMPATIBILITY" "$DEPLOY" "$CREDENTIALS"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              exit 1
            fi
          done

  dispatch-release:
    name: Dispatch release
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.release == 'true' &&
      needs.gate.result == 'success'
    needs: [changes, gate]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Release the validated commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run release.yml
          --repo "$GITHUB_REPOSITORY"
          --ref main
          -f commit_sha="$GITHUB_SHA"

  report-dispatched-validation:
    name: Report dispatched validation
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.gate.result == 'success'
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Report successful validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state=success
          -f context='Required checks'
          -f description='Dispatched CI validation passed'
          -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

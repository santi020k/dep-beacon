  "@astrojs/sitemap": ^3.7.4
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  "@playwright/test": ^1.64.0
  "@santi020k/commitprompt": ^1.1.0
  "@santi020k/eslint-config-astro": ^3.1.5
  "@santi020k/eslint-config-basic": ^3.6.0
  "@santi020k/eslint-config-extensions": ^3.1.4
  "@santi020k/eslint-config-formats": ^3.1.4
  "@santi020k/eslint-config-libraries": ^3.1.4
  "@santi020k/eslint-config-testing": ^3.1.4
  "@santi020k/eslint-config-tools": ^3.1.4
  "@santi020k/lumen-astro": ^4.0.0
  "@santi020k/og": 1.2.0
  "@tailwindcss/vite": ^4.3.3
  # The native package provides tsc; the TypeScript 6 alias below supplies the
  # JavaScript compiler API required by Astro Check and ESLint.
  "@typescript/native": npm:typescript@^7.0.2
  "@types/node": ^26.6.4
  "@types/semver": ^7.8.0
  "@types/vscode": ^1.140.0
  "@vscode/vsce": ^4.0.0
  "@vitest/coverage-v8": ^5.0.3
  astro: ^7.3.7
  cspell: ^10.3.6
  esbuild: ^0.28.2
  eslint: ^10.12.0
  jsonc-parser: ^3.3.1
  knip: ^6.40.0
  lint-staged: ^16.4.0
  ovsx: ^1.2.0
  semver: ^7.8.5
  sharp: ^0.35.5
  tailwindcss: ^4.3.3
  turbo: ^2.11.7
  typescript: npm:@typescript/typescript6@^6.0.2
  vitest: ^5.0.3
  vscode-languageserver: ^10.1.2
  vscode-languageserver-textdocument: ^1.0.15
  wrangler: ^4.148.0
  yaml: ^2.9.1

overrides:
  "@typescript-eslint/utils@<8.71.1": 8.71.1
  "http-cache-semantics@<4.3.0": 4.3.0
  "katex@<0.18.2": 0.19.0
  "markdown-it@>=14.0.0 <14.3.1": 14.3.2

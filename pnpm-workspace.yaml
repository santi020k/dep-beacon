packages:
  - "packages/*"
  - "apps/*"

allowedDeprecatedVersions:
  "@babel/plugin-proposal-private-methods": 7.18.6
  glob: 10.5.0
  node-domexception: 1.0.0
  prebuild-install: 7.1.3
  whatwg-encoding: 3.1.1

allowBuilds:
  "@tailwindcss/oxide": true
  "@vscode/vsce-sign": true
  esbuild: true
  keytar: true
  sharp: true
  unrs-resolver: true
  workerd: true

catalog:
  "@astrojs/check": ^0.9.10
  "@astrojs/mdx": ^7.0.6
  "@astrojs/sitemap": ^3.7.3
  "@changesets/changelog-github": ^0.7.0
  "@changesets/cli": ^2.31.1
  "@santi020k/commitprompt": ^1.0.0
  "@santi020k/eslint-config-astro": ^3.1.1
  "@santi020k/eslint-config-basic": ^3.3.0
  "@santi020k/eslint-config-extensions": ^3.1.1
  "@santi020k/eslint-config-formats": ^3.1.1
  "@santi020k/eslint-config-libraries": ^3.1.1
  "@santi020k/eslint-config-testing": ^3.1.1
  "@santi020k/eslint-config-tools": ^3.1.1
  "@santi020k/lumen-astro": ^1.0.0
  "@tailwindcss/vite": ^4.3.3
  "@typescript/native": npm:typescript@^7.0.2
  "@types/node": ^26.2.0
  "@types/semver": ^7.8.0
  "@types/vscode": ^1.85.0
  "@vscode/vsce": ^3.9.2
  "@vitest/coverage-v8": ^4.1.11
  astro: ^7.2.8
  cspell: ^10.0.1
  esbuild: ^0.28.2
  eslint: ^10.8.1
  husky: ^9.1.7
  jsonc-parser: ^3.3.1
  knip: ^6.32.2
  lint-staged: ^17.3.0
  ovsx: ^1.1.1
  semver: ^7.8.5
  sharp: ^0.35.3
  tailwindcss: ^4.3.3
  turbo: ^2.10.11
  typescript: npm:@typescript/typescript6@^6.0.2
  vitest: ^4.1.11
  vscode-languageserver: ^10.1.0
  vscode-languageserver-textdocument: ^1.0.12
  wrangler: ^4.124.0
  yaml: ^2.9.0

overrides:
  "fast-uri@<3.1.5": 3.1.5
  "js-yaml@<3.15.1": 3.15.1
  "js-yaml@>=4.0.0 <4.3.1": 4.3.1
  "linkify-it@<5.0.2": 5.0.2
  "nanoid@<3.3.18": 3.3.18
  "postcss@<=8.5.17": 8.5.25
  "svgo@>=4.0.0 <4.0.2": 4.0.2
  "undici@<7.29.0": 7.29.0
  "yaml@<2.8.3": 2.8.3

minimumReleaseAgeExclude:
  - '@santi020k/eslint-config-typescript'
  - yaml@2.8.3
  - brace-expansion@5.0.8

auditConfig:
  ignoreGhsas:
    # Dev-only lint tooling requires the legacy default export; remove this
    # exception when those tools support brace-expansion 5.
    - GHSA-mh99-v99m-4gvg
    - GHSA-rgw5-rvv9-x895

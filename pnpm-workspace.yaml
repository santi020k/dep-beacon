packages:
  - "packages/*"
  - "apps/*"

allowedDeprecatedVersions:
  "@babel/plugin-proposal-private-methods": 7.18.6
  glob: 10.5.0
  node-domexception: 1.0.0
  prebuild-install: 7.1.3
  whatwg-encoding: 3.1.1

allowBuilds:
  "@tailwindcss/oxide": true
  "@vscode/vsce-sign": true
  esbuild: true
  keytar: true
  sharp: true
  unrs-resolver: true
  workerd: true

catalog:
  "@astrojs/check": ^0.9.10
  "@astrojs/mdx": ^8.0.1
  "@astrojs/sitemap": ^3.7.4
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  "@santi020k/commitprompt": ^1.1.0
  "@santi020k/eslint-config-astro": ^3.1.2
  "@santi020k/eslint-config-basic": ^3.5.1
  "@santi020k/eslint-config-extensions": ^3.1.1
  "@santi020k/eslint-config-formats": ^3.1.1
  "@santi020k/eslint-config-libraries": ^3.1.1
  "@santi020k/eslint-config-testing": ^3.1.1
  "@santi020k/eslint-config-tools": ^3.1.1
  "@santi020k/lumen-astro": ^2.1.0
  "@tailwindcss/vite": ^4.3.3
  "@typescript/native": npm:typescript@^7.0.2
  "@types/node": ^26.6.2
  "@types/semver": ^7.8.0
  "@types/vscode": ^1.138.0
  "@vscode/vsce": ^4.0.0
  "@vitest/coverage-v8": ^5.0.1
  astro: ^7.3.4
  cspell: ^10.3.3
  esbuild: ^0.28.2
  eslint: ^10.11.0
  husky: ^9.1.7
  jsonc-parser: ^3.3.1
  knip: ^6.37.0
  lint-staged: ^17.5.1
  ovsx: ^1.2.0
  semver: ^7.8.5
  sharp: ^0.35.4
  tailwindcss: ^4.3.3
  turbo: ^2.11.2
  typescript: npm:@typescript/typescript6@^6.0.2
  vitest: ^5.0.1
  vscode-languageserver: ^10.1.1
  vscode-languageserver-textdocument: ^1.0.14
  wrangler: ^4.135.0
  yaml: ^2.9.1

overrides:
  astro@<7.2.8: ^7.2.8
  astro@<=7.2.3: ^7.2.4
  devalue@<5.9.1: ^5.9.1
  "fast-uri@<3.1.5": 3.1.5
  fast-uri@>=3.0.0 <3.1.6: ^3.1.6
  fast-uri@>=3.1.2 <3.1.6: ^3.1.6
  fast-uri@>=3.1.3 <3.1.6: ^3.1.6
  "js-yaml@<3.15.1": 3.15.1
  js-yaml@>=3.0.0 <3.15.2: ^3.15.2
  "js-yaml@>=4.0.0 <4.3.1": 4.3.1
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  "linkify-it@<5.0.2": 5.0.2
  "nanoid@<3.3.18": 3.3.18
  "postcss@<=8.5.17": 8.5.25
  qs@>=2.2.5 <6.16.0: ^6.16.0
  qs@>=6.14.2 <=6.15.3: ^6.15.4
  sharp@<0.35.4: ^0.35.4
  smol-toml@<=1.7.0: ^1.7.1
  "svgo@>=4.0.0 <4.0.2": 4.0.2
  svgo@>=4.0.0 <4.1.0: ^4.1.0
  "undici@<7.29.0": 7.29.0
  "yaml@<2.8.3": 2.8.3

minimumReleaseAgeExclude:
  - "@santi020k/eslint-config-typescript"
  - yaml@2.8.3
  - brace-expansion@5.0.8
  - qs@6.15.4
  - qs@6.16.0
  - fast-uri@3.1.6
  - astro@7.2.8
  - astro@7.2.4
  - sharp@0.35.4
  - js-yaml@3.15.2
  - js-yaml@4.3.2
  - svgo@4.1.0
  - smol-toml@1.7.1
  - devalue@5.9.1

auditConfig:
  ignoreGhsas:
    # Dev-only lint tooling requires the legacy default export; remove this
    # exception when those tools support brace-expansion 5.
    - GHSA-mh99-v99m-4gvg
    - GHSA-rgw5-rvv9-x895

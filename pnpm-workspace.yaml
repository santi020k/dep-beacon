  # Reuse the maintained packager instead of its older vulnerable dependency tree.
  "ovsx>@vscode/vsce": 4.0.0
  "oxlint@<1.87.0": 1.87.0
  "shell-quote@<1.11.0": 1.12.0
  "source-map-js@<1.2.2": 1.2.2
  "brace-expansion@<2.0.0": 1.1.21
  "brace-expansion@>=2.0.0 <3.0.0": 2.1.7
  "brace-expansion@>=3.0.0 <4.0.0": 3.0.9
  "brace-expansion@>=4.0.0 <5.0.12": 5.0.12

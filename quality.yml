# yaml-language-server: $schema=https://quality-cli.santi020k.chatgpt.site/quality.schema.json
# quality.yml — one code-quality workflow for this repository
# cspell:ignore clippy
# Tools are auto-detected; entries below make the selected policy explicit.
# A canonical repository script replaces analyzer checks when one is detected,
# while the analyzers remain available to `quality format` and `quality fix`.
version: 1
output: pretty
baseline: .quality-baseline.json
tools:
  astro-check:
    enabled: true
    check: false
    required: true
  cargo-clippy:
    enabled: true
    check: false
    required: true
  cargo-fmt:
    enabled: true
    check: false
    required: true
  cspell:
    enabled: true
    check: false
    required: true
  eslint:
    enabled: true
    check: false
    required: true
  knip:
    enabled: true
    check: false
    required: true
tasks:
  repository-check:
    name: Repository check (validate)
    command: pnpm
    args:
    - run
    - validate
    required: true
    parser: generic
hooks:
  commit-msg:
    steps:
      - name: Validate commit message
        command: pnpm
        args: [exec, commitprompt, validate, --input]
        pass_hook_args: true
  pre-commit:
    steps:
      - name: Check staged files
        command: pnpm
        args: [run, pre-commit]
  pre-push:
    steps:
      - name: Run pre-push gate
        command: pnpm
        args: [run, pre-push]
